[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navimap-satellites"
version = "0.2.0"
description = "Atelier d'hydrographie par satellite : Sentinel-2 L1C (CDSE) + ACOLITE vers GeoJSON côtier. Ne convient pas à la navigation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Berry-Mappemonde" },
]
keywords = [
  "copernicus",
  "sentinel-2",
  "bathymetry",
  "hydrography",
  "openseamap",
  "coastline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "netCDF4>=1.6",
]
l2r = [
  "netCDF4>=1.6",
]
raster = [
  "rasterio>=1.3",
]
l2w = [
  "netCDF4>=1.6",
]

[project.scripts]
navimap-sat = "navimap_satellites.cli:main"

[project.urls]
Homepage = "https://github.com/NAVIGUIDE-for-Berry-Mappemonde/NaviMap-Satellites"
Repository = "https://github.com/NAVIGUIDE-for-Berry-Mappemonde/NaviMap-Satellites"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: appelle l'API STAC publique de Copernicus (peut être lent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
