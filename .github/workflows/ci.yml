name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer le paquet
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: CLI démo
        run: navimap-sat demo --out work/ci-demo
      - name: CLI campagne
        run: navimap-sat campaign aois/berry
