name: Ouvrir les PR Cursor

"on":
  push:
    branches:
      - "cursor/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: open-cursor-prs
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ouvrir les PR manquantes
        env:
          GH_TOKEN: ${{ secrets.PR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/open_cursor_prs.py
